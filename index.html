```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckMath Test</title>
</head>
<body>
<script>
(async () => {
    const blank = window.open("about:blank", "_blank");

    if (!blank) {
        document.body.textContent = "Popup blocked.";
        return;
    }

    try {
        const response = await fetch("./duckmath.html");

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        let html = await response.text();

        // Keep resources relative to duckmath.html.
        html = html.replace(
            /<head([^>]*)>/i,
            `<head$1><base href="${new URL("./", location.href)}">`
        );

        blank.document.open();
        blank.document.write(html);
        blank.document.close();

        // Test the hash route.
        blank.location.hash = "/class/eagle-duckcraft";

    } catch (error) {
        blank.document.body.innerHTML =
            `<h2>Could not load duckmath.html</h2><p>${error}</p>`;
    }
})();
</script>
</body>
</html>
```
