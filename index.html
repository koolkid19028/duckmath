```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>

<script>
(async () => {
    const blank = window.open("about:blank", "_blank");

    if (!blank) {
        document.body.innerHTML = "Please allow popups.";
        return;
    }

    try {
        const response = await fetch("./duckmath.html");

        if (!response.ok) {
            throw new Error("Could not load duckmath.html");
        }

        let html = await response.text();

        // Keep CSS, JS, images, and relative links working.
        const base = new URL("./", window.location.href).href;

        html = html.replace(
            /<head([^>]*)>/i,
            `<head$1><base href="${base}">`
        );

        blank.document.open();
        blank.document.write(html);
        blank.document.close();

    } catch (error) {
        blank.document.open();
        blank.document.write(`
            <h2>Failed to load duckmath.html</h2>
            <p>${error.message}</p>
        `);
        blank.document.close();
    }
})();
</script>

</body>
</html>
```
