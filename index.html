```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckMath</title>
</head>
<body>

<script>
(function () {
    const firstVisitKey = "duckmath_first_visit";
    const duckmath = "duckmath.html";

    // Check whether this browser has visited before.
    const hasVisited = localStorage.getItem(firstVisitKey);

    if (!hasVisited) {
        // Remember that the first visit has happened.
        localStorage.setItem(firstVisitKey, "1");

        // First visit → Settings.
        window.location.replace(duckmath + "#/settings");
    } else {
        // Subsequent visits → normal DuckMath page.
        window.location.replace(duckmath);
    }
})();
</script>

<noscript>
    <p>
        <a href="duckmath.html">Open DuckMath</a>
    </p>
</noscript>

</body>
</html>
```
